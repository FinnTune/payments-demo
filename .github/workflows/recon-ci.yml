name: Recon CI

on:
  push:
    branches: [master, main]
    paths:
      - 'recon/**'
      - '.github/workflows/recon-ci.yml'
  pull_request:
    paths:
      - 'recon/**'
      - '.github/workflows/recon-ci.yml'

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Typecheck
        run: mypy src/

      - name: Test
        run: pytest -ra
