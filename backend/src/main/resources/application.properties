spring.application.name=payments-service

# Datasource — Postgres in Docker for local dev (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=payments
spring.datasource.password=payments

# Schema is owned by Flyway migrations under src/main/resources/db/migration.
# Hibernate validates that the entity mappings match the actual schema.
spring.jpa.hibernate.ddl-auto=validate

# Suppress the open-in-view warning by being explicit
spring.jpa.open-in-view=false

# See the SQL Hibernate generates — useful for learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Profile (dev / staging / prod)
spring.profiles.active=dev

management.endpoints.web.exposure.include=health,info,metrics,prometheus