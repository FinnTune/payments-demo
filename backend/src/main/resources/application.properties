spring.application.name=payments-service

# Auto-create schema from entity mappings (DEV ONLY).
# In production, schema is owned by Flyway migrations; we'll switch to that later.
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress the open-in-view warning by being explicit
spring.jpa.open-in-view=false

# See the SQL Hibernate generates — useful for learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true